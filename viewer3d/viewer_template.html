<title>3D Proof Viewer</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
:root{--bg:#f3f1ee;--fg:#1d1b19;--mut:#6b655e;--card:#fff;--line:#d9d4cd;--acc:#c2410c;--stage:#e9e6e1}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15130f;--fg:#efebe5;--mut:#9a938a;--card:#201d19;--line:#38332d;--acc:#fb923c;--stage:#1b1815;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#15130f;--fg:#efebe5;--mut:#9a938a;--card:#201d19;--line:#38332d;--acc:#fb923c;--stage:#1b1815;color-scheme:dark}
body{background:var(--bg);color:var(--fg);font:14px/1.45 Inter,system-ui,sans-serif;padding-block:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.w{max-width:1100px;margin:auto;display:flex;flex-direction:column;gap:12px}
h1{font:600 18px/1.2 Inter,system-ui,sans-serif;margin:0}.sub{color:var(--mut);font-size:13px}
header{display:flex;justify-content:space-between;gap:8px 16px;flex-wrap:wrap;align-items:baseline}
#stage{position:relative;height:min(62vh,600px);min-height:320px;background:var(--stage);border:1px solid var(--line);border-radius:10px;overflow:hidden;touch-action:none}
#stage canvas{display:block}
#load[hidden]{display:none}#load{position:absolute;inset:0;display:grid;place-items:center;color:var(--mut)}
.bar{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}
.seg{display:flex;flex-wrap:wrap;gap:6px}
button,.btn{font:inherit;background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:6px 11px;cursor:pointer}
button[aria-pressed=true]{border-color:var(--acc);color:var(--acc)}
label.t{display:flex;gap:5px;align-items:center;color:var(--mut)}
.hint{color:var(--mut);font-size:12px}
</style>
<div class="w">
<header><div><h1>3D Proof Viewer</h1><div class="sub"><span id="pname">__PNAME__</span> · __DIMS__</div></div>
<div class="hint">Drag to orbit · scroll/pinch to zoom · right-drag to pan · drop a JPEG to re-skin</div></header>
<div id="stage"><div id="load">Loading model…</div></div>
<div class="bar"><div class="seg">
<button data-v="3q">3/4</button><button data-v="front">Front</button><button data-v="back">Back</button><button data-v="left">Left</button><button data-v="right">Right</button><button data-v="top">Top</button></div>
<div class="seg"><button id="zout" title="Zoom out">−</button><button id="zin" title="Zoom in">+</button><button id="zfit">Fit</button></div>
<label class="t"><input type="checkbox" id="rot">Auto-rotate</label>
<label class="t"><input type="checkbox" id="shd" checked>Shadow</label>
<label class="t"><input type="checkbox" id="tbl" checked>Table</label>
<label class="t"><input type="checkbox" id="wire">Wireframe</label>
<label class="btn">Swap proof…<input id="file" type="file" accept="image/*" hidden></label>
<button id="reset">Reset</button></div>
</div>
